<section
    id="code-scene"
    class="scene"
>

    <!-- Birthday Code Background -->

    <div class="code-background">

        <div class="code-glow"></div>

    </div>


    <!-- Birthday Card -->

    <div class="code-container">


        <div class="birthday-card">


            <!-- Card Eyebrow -->

            <p class="code-eyebrow">
                A Special Day
            </p>


            <!-- Main Date -->

            <div class="birthday-date">


                <span
                    id="birthday-day"
                    class="date-day"
                >
                    06
                </span>


                <span
                    id="birthday-month"
                    class="date-month"
                >
                    SEPTEMBER
                </span>


                <span
                    id="birthday-year"
                    class="date-year"
                >
                    2026
                </span>


            </div>


            <!-- Message -->

            <p
                id="birthday-code-message"
                class="birthday-code-message"
            >
                This day is all about you.
            </p>


            <!-- Continue -->

            <button
                id="continue-code-button"
            >
                CONTINUE
            </button>

            <!-- Back -->

            <button
                id="back-to-gift"
            >
                BACK
            </button>


        </div>


    </div>


</section>
