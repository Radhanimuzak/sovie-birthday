<section
            id="gift-scene"
            class="scene"
        >


            <!-- Gift Background -->

            <div class="gift-background">

                <div class="gift-glow"></div>

            </div>


            <!-- Gift Content -->

            <div class="gift-container">


                <p class="gift-eyebrow">
                    A little something
                </p>


                <h2>
                    For You...
                </h2>


                <!-- Gift Box -->

                <div class="gift-wrapper">

                    <div class="gift-box">


                        <!-- Gift Lid -->

                        <div class="gift-lid">

                            <div class="gift-ribbon-horizontal"></div>

                        </div>


                        <!-- Gift Body -->

                        <div class="gift-body">

                            <div class="gift-ribbon-vertical"></div>

                        </div>


                        <!-- Gift Bow -->

                        <div class="gift-bow">

                            <span class="bow-left"></span>

                            <span class="bow-right"></span>

                            <span class="bow-center"></span>

                        </div>


                    </div>

                </div>


                <!-- Gift Description -->

                <p class="gift-hint">
                    Something special is waiting inside...
                </p>


                <!-- Open Gift -->

                <button id="open-gift-button">
                    OPEN
                </button>


                <!-- Back -->

                <button id="back-to-countdown">
                    BACK
                </button>


            </div>


        </section>
