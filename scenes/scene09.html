<section id="music-scene" class="scene" aria-labelledby="music-title">
    <div class="music-ambient" aria-hidden="true"><span>✦</span><span>♡</span><span>·</span><span>✧</span></div>
    <div class="music-container">
        <header class="music-heading"><p>OUR LITTLE SOUNDTRACK</p><h1 id="music-title">OUR MUSIC</h1><em>7 songs, 7 little memories.</em></header>
        <main class="music-stage">
            <div id="music-vinyl" class="music-vinyl" aria-hidden="true"><i></i></div>
            <p id="music-count" class="music-count">01 / 07</p>
            <h2 id="music-song-title"></h2><p id="music-artist"></p>
            <input id="music-progress" class="music-progress" type="range" min="0" max="0" value="0" aria-label="Song progress">
            <p class="music-time"><span id="music-current-time">00:00</span><span id="music-duration">00:00</span></p>
            <div class="music-controls"><button id="music-previous" type="button" aria-label="Previous song">◀</button><button id="music-toggle" type="button" aria-label="Play song">▶</button><button id="music-next-song" type="button" aria-label="Next song">▶</button></div>
            <article class="music-memory"><p id="music-label">THE BEGINNING</p><h3>A LITTLE MEMORY</h3><p id="music-reason"></p></article>
            <p id="music-ending" class="music-ending" hidden>7 songs.<br>7 little memories.<br>But somehow, they all remind me of you. 🤍</p>
        </main>
        <nav class="music-actions"><button id="music-back" type="button">← BACK</button><button id="music-next-scene" type="button">NEXT →</button></nav>
    </div>
</section>
