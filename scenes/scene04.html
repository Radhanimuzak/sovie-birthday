<section
    id="greeting-scene"
    class="scene"
>

    <!-- Greeting Background -->

    <div class="greeting-background">

        <div class="greeting-glow"></div>

    </div>


    <!-- Greeting Content -->

    <div class="greeting-container">


        <p
            id="greeting-line-1"
            class="greeting-line"
        >
            Hey, Sovie...
        </p>


        <p
            id="greeting-line-2"
            class="greeting-line"
        >
            Today is different.
        </p>


        <p
            id="greeting-line-3"
            class="greeting-line"
        >
            Because...
        </p>


        <p
            id="greeting-line-4"
            class="greeting-line emphasis"
        >
            it's YOU.
        </p>


        <h2
            id="greeting-birthday"
            class="greeting-birthday"
        >
            ✨ Happy Birthday ✨
        </h2>

        <button
            id="greeting-continue-button"
        >
            LET'S BEGIN
        </button>

        <button
            id="back-to-code"
        >
            BACK
        </button>


    </div>


</section>
